# Main configuration file for firewalld
# /etc/firewalld

DefaultZone=public
MinimalMark=100
CleanupOnExit=yes
# Whether to enable strict lockdown mode, preventing dynamic addition, modification, and deletion of firewall rules
Lockdown=no
IndividualCalls=no
# Whether to log denied connection requests.
LogDenied=off
# Whether to unload firewall-related kernel modules on exit or stop
CleanupModulesOnExit=no
IPv6_rpfilter=strict
FirewallBackend=nftables
# Whether to clear all runtime rules when reloading the firewalld configuration
FlushAllOnReload=True
RFC3964_IPv4=True
