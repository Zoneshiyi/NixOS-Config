# Noctalia v5 configuration.

# ── Shell ──────────────────────────────────────────────────────────────────────

[shell]
font_family = "Sarasa UI SC"
settings_show_advanced = true

[shell.launcher]
app_grid = true
show_icons = true
sort_by_usage = true
# pinned = []

# ── Theme ──────────────────────────────────────────────────────────────────────

[theme]
mode = "dark"
source = "builtin"
builtin = "Nord"

# ── Wallpaper ──────────────────────────────────────────────────────────────────

[wallpaper]
enabled = true

# ── Notifications ──────────────────────────────────────────────────────────────

[notification]
enable_daemon = true
max_visible = 5

# ── Bars ───────────────────────────────────────────────────────────────────────

[bar]
order = ["top", "side"]

[bar.top]
position = "top"
thickness = 35
scale = 1.25
radius = 8
margin_ends = 0
# margin_edge = 0
padding = 14
shadow = false
auto_hide = false
# capsule = true
capsule_thickness  = 0.9
capsule_padding    = 8
capsule_radius     = 8
start = ["workspaces"]
center = []
end = ["notifications", "gap", "clock"]

[bar.side]
position = "right"
thickness = 46
scale = 1.25
radius = 8
margin_ends = 3
# margin_edge = 0
padding = 16
widget_spacing = 13
shadow = false
auto_hide = false
capsule_thickness  = 0.9
capsule_padding    = 5
capsule_radius     = 5
start = ["taskbar"]
center = []
end = ["volume", "tray", "session"]

# ── Widgets ────────────────────────────────────────────────────────────────────

[widget.workspaces]
style = "regular"
show_labels = true
label_source = "id"
max_label_chars = 2
font_scale = 1.3
empty_color = "surface_variant"
change_color_on_hover = true
scroll_repeat = "auto"

[widget.gap]
type   = "spacer"
length = 16

[widget.clock]
format = "{:%H:%M}  {:%a}  {:%m-%d}"
tooltip_format = "{:%A, %B %d, %Y}"

[widget.clock.actions]
right = "panel-toggle control-center calendar"

[widget.notifications]
hide_when_no_unread = false

[widget.notifications.actions]
left = "notification-dnd-toggle"
right = "panel-toggle control-center notifications"

[widget.taskbar]
group_by_workspace = false
show_all_outputs = false
only_active_workspace = false
icon_scale = 1.5
item_spacing = 8

[widget.volume]
show_label = true

[widget.volume.actions]
left = "exec pavucontrol"
right = "volume-mute"

[widget.tray]
drawer = false
hide_passive = true

[widget.session]
glyph = "shutdown"